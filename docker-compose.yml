services:
  qdrant:
    image: qdrant/qdrant:v1.15.2
    container_name: internal-doc-qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    image: ghcr.io/h4ck4life/internal-doc-search:latest
    container_name: internal-doc-api
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      # ./.cache holds BOTH the HuggingFace model cache (HF_HOME) AND the
      # Playwright Chromium binary (PLAYWRIGHT_BROWSERS_PATH), so
      # restarts/upgrades don't redownload either. The browser is also
      # baked into the image via the multi-stage Dockerfile, so the
      # first run works even if ./cache is empty. Keep this directory
      # in your .gitignore (already done).
      - ./.cache:/app/.cache
    depends_on:
      - qdrant
    shm_size: '2gb'
    environment:
      - QDRANT_URL=http://qdrant:6333

volumes:
  qdrant_data:
