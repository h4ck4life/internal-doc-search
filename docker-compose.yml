services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: internal-doc-qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: .
    container_name: internal-doc-api
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./.cache:/app/.cache
    depends_on:
      - qdrant
    shm_size: '2gb'
    environment:
      - QDRANT_URL=http://qdrant:6333

volumes:
  qdrant_data:
