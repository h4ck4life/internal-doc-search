services:
  qdrant:
    image: qdrant/qdrant:v1.15.2
    container_name: internal-doc-qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    image: ghcr.io/h4ck4life/internal-doc-search:latest
    container_name: internal-doc-api
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      # Playwright Chromium and HuggingFace models are baked into the
      # image at /app/.cache/ms-playwright and /app/.cache/huggingface
      # — no host bind mount is needed. Only the SQLite database is
      # persisted here.
    depends_on:
      - qdrant
    shm_size: '2gb'
    environment:
      - QDRANT_URL=http://qdrant:6333

volumes:
  qdrant_data:
