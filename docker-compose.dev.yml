# Development compose file — builds from local source instead of pulling
# the published image. Use this when you're modifying code.
#
#   docker compose -f docker-compose.dev.yml up -d

services:
  qdrant:
    image: qdrant/qdrant:v1.15.2
    container_name: internal-doc-qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: .
    container_name: internal-doc-api
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./.cache:/app/.cache
    depends_on:
      - qdrant
    shm_size: '2gb'
    environment:
      - QDRANT_URL=http://qdrant:6333

volumes:
  qdrant_data:
