name: build-amd64

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Use a classic PAT with write:packages + read:packages, stored
          # as the GHCR_TOKEN repo secret. The default GITHUB_TOKEN does
          # not have packages: write in this context, so we need a PAT.
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Read existing arm64 digest
        id: read-arm64
        run: |
          # Pull the existing arm64 manifest digest from the latest tag so we
          # can merge it into a multi-arch index in the next step.
          arm64_digest=$(docker buildx imagetools inspect \
            ghcr.io/h4ck4life/internal-doc-search:latest \
            --raw 2>/dev/null \
            | jq -r '.manifests[] | select(.platform.architecture=="arm64" and .platform.os=="linux") | .digest' \
            | head -1)
          echo "arm64_digest=$arm64_digest" >> "$GITHUB_OUTPUT"

      - name: Build linux/amd64 and merge multi-arch manifest
        env:
          ARM64_DIGEST: ${{ steps.read-arm64.outputs.arm64_digest }}
        run: |
          set -euo pipefail
          # Build amd64 and push as a single-platform image first.
          docker buildx build \
            --platform linux/amd64 \
            --tag ghcr.io/h4ck4life/internal-doc-search:amd64-tmp \
            --output type=image,push=true \
            .

          # Build a multi-arch manifest index on the runner:
          #   * arm64 entry = the existing image on GHCR (by digest)
          #   * amd64 entry = the image we just pushed
          # Then push the index under :latest and :vX.Y.Z tags.
          if [ -n "${GITHUB_REF_TYPE}" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAGS="--tag ghcr.io/h4ck4life/internal-doc-search:latest --tag ghcr.io/h4ck4life/internal-doc-search:${GITHUB_REF_NAME}"
          else
            TAGS="--tag ghcr.io/h4ck4life/internal-doc-search:latest"
          fi

          docker buildx imagetools create \
            ${TAGS} \
            ghcr.io/h4ck4life/internal-doc-search@${ARM64_DIGEST} \
            ghcr.io/h4ck4life/internal-doc-search:amd64-tmp

      - name: Inspect final multi-arch manifest
        run: |
          docker buildx imagetools inspect ghcr.io/h4ck4life/internal-doc-search:latest
